services:
  iptv-merge-manager:
    build: .
    image: iptv-merge-manager:0.3.0
    container_name: iptv-merge-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/New_York
      REFRESH_HOURS: "4"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
