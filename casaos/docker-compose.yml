name: iptv-merge-manager

services:
  iptv-merge-manager:
    image: ghcr.io/kody-r/iptv-merge-manager:0.3.4
    container_name: iptv-merge-manager
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      TZ: America/New_York
      REFRESH_HOURS: "4"
      HLS_SEGMENT_CONNECT_TIMEOUT: "4"
      HLS_SEGMENT_FIRST_BYTE_TIMEOUT: "6"
      HLS_SEGMENT_READ_IDLE_TIMEOUT: "10"
      HLS_SEGMENT_TOTAL_TIMEOUT: "20"
      HLS_SEGMENT_PLAYLIST_REFRESH_TIMEOUT: "4"
      HLS_SEGMENT_MAX_ATTEMPTS: "2"
    volumes:
      - /DATA/AppData/iptv-merge-manager/data:/app/data
      - /DATA/AppData/iptv-merge-manager/output:/app/output

x-casaos:
  id: com.github.iptv-merge-manager
  main: iptv-merge-manager
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/kody-r/iptv-merge-manager/main/casaos/icon.svg
  title:
    en_US: IPTV Merge Manager
  tagline:
    en_US: Curate multiple IPTV playlists and XMLTV guides into one lineup.
  description:
    en_US: Merge multiple M3U/M3U8 sources and optional XMLTV guides, select individual channels, sort the master lineup, assign channel numbers, and publish a single M3U and XMLTV feed for Jellyfin or other IPTV clients.
  author: kody-r
  developer: IPTV Merge Manager
  category: Media
  architectures:
    - amd64
    - arm64
  version: "0.3.4"
  update_at: "2026-08-14"
  release_notes:
    en_US: "v0.3.4 adds Protected Playback: fixed-rendition HLS with disk-backed atomic segment acquisition, bounded retries, prefetching, cache reuse, timeout/skip recovery, and one-time migration of existing Fixed channels to Protected."
