name: iptv-merge-manager

services:
  iptv-merge-manager:
    image: ghcr.io/kody-r/iptv-merge-manager:0.4.0
    container_name: iptv-merge-manager
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      TZ: America/New_York
      REFRESH_HOURS: "4"
      HLS_SEGMENT_CONNECT_TIMEOUT: "4"
      HLS_SEGMENT_FIRST_BYTE_TIMEOUT: "6"
      HLS_SEGMENT_READ_IDLE_TIMEOUT: "10"
      HLS_SEGMENT_TOTAL_TIMEOUT: "20"
      HLS_SEGMENT_PLAYLIST_REFRESH_TIMEOUT: "4"
      HLS_SEGMENT_MAX_ATTEMPTS: "2"
    volumes:
      - /DATA/AppData/iptv-merge-manager/data:/app/data
      - /DATA/AppData/iptv-merge-manager/output:/app/output

x-casaos:
  id: com.github.iptv-merge-manager
  main: iptv-merge-manager
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/kody-r/iptv-merge-manager/main/casaos/icon.svg
  title:
    en_US: IPTV Merge Manager
  tagline:
    en_US: Merge, protect, and stabilize IPTV playlists and XMLTV guides in one lineup.
  description:
    en_US: Merge multiple M3U/M3U8 sources and XMLTV guides, curate the master lineup, protect HLS acquisition, and optionally stabilize troublesome FAST/SSAI channels with on-demand FFmpeg normalization before publishing one M3U/XMLTV feed for Jellyfin.
  author: kody-r
  developer: IPTV Merge Manager
  category: Media
  architectures:
    - amd64
    - arm64
  version: "0.4.0"
  update_at: "2026-08-15"
  release_notes:
    en_US: "v0.4.0 integrates on-demand FFmpeg stream stabilization with source defaults and per-channel overrides. Stabilized Remux normalizes HLS/MPEG-TS timestamps without -copyts/-re; Full Transcode provides a stronger software fallback. Protected acquisition remains available underneath stabilization."
